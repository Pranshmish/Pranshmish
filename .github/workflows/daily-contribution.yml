name: Daily Green Contribution

on:
  schedule:
    # Runs at 20:00 UTC and 23:00 UTC daily (checks if commits were made; commits if nothing was committed today)
    - cron: "0 20,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force commit regardless of whether commits exist today"
        required: false
        default: false
        type: boolean

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync Telemetry & Check Activity
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          python scripts/sync_telemetry.py

      - name: Commit & Push Changes
        if: steps.sync.outputs.should_commit == 'true'
        run: |
          git config --global user.name "Pranshmish"
          git config --global user.email "pragya636@gmail.com"
          
          git add data/ generated/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            if [ -f generated/.commit_msg.tmp ]; then
              git commit -F generated/.commit_msg.tmp
              rm -f generated/.commit_msg.tmp
            else
              git commit -m "feat(telemetry): record system metrics and performance updates"
            fi
            git push
            echo "Successfully committed and pushed daily engineering update."
          fi

      - name: Skipped
        if: steps.sync.outputs.should_commit != 'true'
        run: |
          echo "Commits already detected for today. Skipping automated commit."
